<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARROW SLIDE · BRUTAL</title>
    <!-- NeoBrutalist Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Remix Icon & Font Awesome for footer icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="cursor"></div>

    <div class="brutal-layout">
        <!-- main game box -->
        <div class="game-container">
            <div class="title-block">
                 ARROW <span>SLIDE</span>
            </div>

            <div class="stats-bar">
                <div> LVL <span id="levelDisplay">1</span></div>
                <div> MOVES <span id="movesDisplay">0</span></div>
            </div>

            <div class="message-panel">
                <div id="congratsMessage" class="congrats">🎉 LEVEL COMPLETE! 🎉</div>
                <div id="stuckMessage" class="stuck-message">⚠️ NO MOVES! CLICK RESTART</div>
            </div>

            <div class="grid-wrapper">
                <div id="gridContainer" class="grid"></div>
            </div>

            <div class="marquee-container">
                <div class="marquee-content">
                    <span>/// SLIDE & SOLVE /// NO OPPOSITES IN ROW/COL ///</span>
                    <span>/// SLIDE & SOLVE /// NO OPPOSITES IN ROW/COL ///</span>
                </div>
            </div>
        </div>

        <!-- side panel with buttons -->
        <div class="button-side">
            <div class="button-row">
                <button class="btn" id="undoBtn"><i class="ri-arrow-go-back-line"></i> UNDO</button>
                <button class="btn" id="hintBtn"><i class="ri-lightbulb-line"></i> HINT</button>
                <button class="btn" id="restartBtn">⟲ RESTART</button>
                <button class="btn next" id="nextBtn">⏩ NEXT</button>
            </div>
        </div>
    </div>

    <footer class="brutal-footer">
        <p class="creator">Created by <a href="https://instai4.github.io/PORT-FOLIO/" target="_blank">Anurag</a> · Arrow Slide Brutal</p>
        <div class="social-icons">
            <a href="https://www.instagram.com/inst.ai.4?igsh=MWNqaG15OWQ2MGczMA==" target="_blank" class="social-icon" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/share/1DMBwCvzDL/" target="_blank" class="social-icon" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="https://www.linkedin.com/in/anurag-singh-43230a380/" target="_blank" class="social-icon" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/instai4" target="_blank" class="social-icon" aria-label="GitHub"><i class="fab fa-github"></i></a>
        </div>
    </footer>

    


    <script src="script.js"></script>
</body>
</html>
